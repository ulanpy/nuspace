services:
  postgres:
    image: kamikadze24/postgres-walg:latest
    networks:
      - nuros
    restart: always
    container_name: postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      WALG_GS_PREFIX: gs://${BACKUPS_BUCKET_NAME}/wal-g/main
    # GCE VM is bound to nuspace-vm-sa (no JSON key in the container). wal-g uses Google
    # Application Default Credentials: its client library calls the VM metadata server at
    # metadata.google.internal to get a short-lived OAuth token, then uploads WAL via wal-push.
    # extra_hosts is required because the Docker bridge network does not resolve that hostname.
    extra_hosts:
      - "metadata.google.internal:169.254.169.254"
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=wal-g wal-push %p
      - -c
      - archive_timeout=3600
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backup:
    image: kamikadze24/nuspace-backup:latest
    container_name: backup
    init: true
    networks:
      - nuros
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PGHOST: postgres
      PGPORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      WALG_GS_PREFIX: gs://${BACKUPS_BUCKET_NAME}/wal-g/main
      BACKUPS_BUCKET_NAME: ${BACKUPS_BUCKET_NAME}
      PGDATA: /var/lib/postgresql/data
    volumes:
      # Local backup-push reads PGDATA; remote mode needs replication in pg_hba.
      - postgres-data:/var/lib/postgresql/data:ro
    # Same metadata route as postgres: wal-g backup-push uses ADC (library → metadata → token).
    # pg_dump upload is explicit: scripts/pg-dump-backup.sh curls metadata for a token, then
    # POSTs the gzip file to the GCS JSON API. extra_hosts makes metadata.google.internal reachable.
    extra_hosts:
      - "metadata.google.internal:169.254.169.254"

  fastapi:
    container_name: fastapi
    image: kamikadze24/fastapi:latest
    cap_add:
      - NET_ADMIN
    networks:
      - nuros
    restart: always
    # One client socket per in-flight request plus outbound connections (DB,
    # Meilisearch, telemetry). Docker's default 1024 descriptors makes Uvicorn
    # stop accepting connections under load before application limits are hit.
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      - postgres
      - nginx
    environment:
      - PYTHONUNBUFFERED=1
      # Shell-visible for start.sh (/.env alone is not enough). Single uvicorn, no --reload.
      - IS_DEBUG=false
      - NO_PROXY=169.254.169.254,metadata.google.internal
      - no_proxy=169.254.169.254,metadata.google.internal
    extra_hosts:
      - "metadata.google.internal:169.254.169.254"
    volumes:
      - .env:/.env:ro

  migrate:
    image: kamikadze24/fastapi:latest
    container_name: migrate
    networks:
      - nuros
    depends_on:
      - postgres
    restart: "no"
    env_file:
      - ${MIGRATE_ENV_FILE:-./.env}
    environment:
      - PYTHONUNBUFFERED=1
      - NO_PROXY=169.254.169.254,metadata.google.internal
      - no_proxy=169.254.169.254,metadata.google.internal
    extra_hosts:
      - "metadata.google.internal:169.254.169.254"
    volumes:
      - ${MIGRATE_ENV_FILE:-.env}:/nuros/infra/.env:ro
    working_dir: /nuros/backend
    command: alembic upgrade head

  nginx:
    container_name: nginx
    image: nginx:1.29.1-alpine
    networks:
      - nuros
    restart: always
    # Each proxied request has client and upstream descriptors.
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ../web/out:/var/www/my-app/out
      - ../ssl/cloudflare.crt:/etc/ssl/cloudflare/origin.crt
      - ../ssl/cloudflare.key:/etc/ssl/cloudflare/origin.key
      - ./nginx/vpn-index.html:/etc/nginx/vpn-index.html:ro
      - nginx-logs:/var/log/nginx
    # SSR Alternative: Change depends_on to frontend and remove out volume
    # depends_on:
    #   - frontend
    command: >
      /bin/sh -c "
        if [ -L /var/log/nginx/access.log ]; then
          rm /var/log/nginx/access.log && touch /var/log/nginx/access.log;
        fi &&
        apt update && apt install -y inotify-tools &&
        (while inotifywait -e modify /etc/nginx/nginx.conf; do
          echo 'nginx config changed, copying and reloading Nginx...' &&
          nginx -t && nginx -s reload;
        done) &
        exec nginx -g 'daemon off;'"

  redis:
    image: redis:8.2.1-alpine3.22
    networks:
      - nuros
    container_name: redis
    restart: always
    volumes:
      - redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server --bind 0.0.0.0 --protected-mode no

  meilisearch:
    image: getmeili/meilisearch:v1.19.1
    networks:
      - nuros
    container_name: meilisearch
    ports:
      - "127.0.0.1:7700:7700"

  rabbitmq:
    image: rabbitmq:4.2.1
    container_name: rabbitmq
    networks:
      - nuros
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro

    healthcheck:
      test: [ "CMD", "rabbitmq", "status" ]
      interval: 30s
      timeout: 10s
      retries: 5

  loki:
    container_name: loki
    image: grafana/loki:3.5.3
    volumes:
      - ./loki/loki.prod.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml -log.level="warn" -config.expand-env=true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks:
      - nuros

  tempo:
    container_name: tempo
    image: grafana/tempo:3.0.0
    user: "0"
    command: [ "-config.file=/etc/tempo/tempo.yaml" ]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    restart: unless-stopped
    networks:
      - nuros

  pyroscope:
    container_name: pyroscope
    image: grafana/pyroscope:2.2.1
    user: "0" # named volume may be created with a different owner
    command: ["-config.file=/etc/pyroscope/config.yaml", "-retention-period=7d"]
    volumes:
      - ./pyroscope/config.yaml:/etc/pyroscope/config.yaml:ro
      - pyroscope_data:/var/lib/pyroscope
    restart: unless-stopped
    networks:
      - nuros

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
      - "--storage.tsdb.retention.time=30d"
      - "--web.external-url=/prometheus/"
      - "--web.route-prefix=/prometheus/"
    restart: unless-stopped
    networks:
      - nuros

  # Creates/updates grafana_ro (SELECT-only) from env. Idempotent — safe on fresh VM or restart.
  grafana-db-init:
    image: kamikadze24/postgres-walg:latest
    container_name: grafana-db-init
    networks:
      - nuros
    restart: "no"
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      GRAFANA_DB_USER: ${GRAFANA_DB_USER:-grafana_ro}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    volumes:
      - ./scripts/ensure-grafana-ro.sh:/scripts/ensure-grafana-ro.sh:ro
    entrypoint: [ "/bin/bash", "/scripts/ensure-grafana-ro.sh" ]

  grafana:
    container_name: grafana
    # Grafana 13.1.1, verified locally before this production upgrade.
    image: grafana/grafana:13.1.1
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - DS_PROMETHEUS=prometheus
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_LOG_LEVEL=warn
      - GF_SERVER_ROOT_URL=https://vpn.nuspace.kz/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
      - GF_DATABASE_WAL=true
      - DB_NAME=${DB_NAME}
      - GRAFANA_DB_USER=${GRAFANA_DB_USER:-grafana_ro}
      - GRAFANA_DB_PASSWORD=${GRAFANA_DB_PASSWORD}
      - GF_PLUGINS_PREINSTALL_SYNC=grafana-pyroscope-app
    volumes:
      - "grafana-data:/var/lib/grafana"
      - "./grafana/provisioning/datasources/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml"
      - "./grafana/dashboards/cadvisor.json:/var/lib/grafana/dashboards/cadvisor.json"
      - "./grafana/dashboards/fastapi-observability.json:/var/lib/grafana/dashboards/fastapi-observability.json"
      - "./grafana/dashboards/product-overview.json:/var/lib/grafana/dashboards/product-overview.json"
      - "./grafana/dashboards/node-exporter-full.json:/var/lib/grafana/dashboards/node-exporter-full.json"
      - "./grafana/provisioning/dashboards/default.yaml:/etc/grafana/provisioning/dashboards/default.yaml"
      - "./grafana/provisioning/alerting/contact-points.yaml.tpl:/etc/grafana/provisioning/alerting/contact-points.yaml.tpl"
      - "./grafana/provisioning/alerting/alerting.yaml:/etc/grafana/provisioning/alerting/alerting.yaml"
      - "./grafana/provisioning/alerting/alerts.yaml:/etc/grafana/provisioning/alerting/alerts.yaml"
      - "./grafana/provisioning/alerting/notification_policies.yaml:/etc/grafana/provisioning/alerting/notification_policies.yaml"
      - "./grafana/provisioning/alerting/notification_templates.yaml:/etc/grafana/provisioning/alerting/notification_templates.yaml"
      - "./scripts/start-grafana.sh:/start-grafana.sh"
    entrypoint: [ "/bin/sh", "/start-grafana.sh" ]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks:
      - nuros
    depends_on:
      grafana-db-init:
        condition: service_completed_successfully
      alloy:
        condition: service_started

  alloy:
    container_name: alloy
    image: grafana/alloy:v1.10.1
    # cAdvisor needs host cgroup tree + docker metadata (privileged + /sys mount).
    privileged: true
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /var/run:/var/run:ro
      - /:/rootfs:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /sys:/sys:ro
      - /dev/disk/:/dev/disk:ro
      - nginx-logs:/var/log/nginx:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 --server.http.ui-path-prefix=/alloy/ --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    restart: unless-stopped
    networks:
      - nuros
    depends_on:
      - prometheus
      - loki
      - tempo
      - pyroscope

  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15.3.0
    container_name: wg-easy
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    networks:
      - nuros
    environment:
      - INSECURE=true
      # - PORT=51821
      # - HOST=localhost
    volumes:
      - ./wg-easy:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"
      - "127.0.0.1:51821:51821/tcp"
    restart: unless-stopped
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1

networks:
  nuros:
    name: nuspace_nuros
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1460"
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1

volumes:
  nginx-logs:
  postgres-data:
  redis-data:
    driver: local
  rabbitmq-data:
  grafana-data:
  prometheus_data:
  loki_data:
  tempo_data:
  pyroscope_data:
