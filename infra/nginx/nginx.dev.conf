worker_processes auto;

events {
    worker_connections 16000;
    use epoll;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    # Persist JSON access logs to a real file. Alloy tails this shared volume;
    # successful requests never make FastAPI synchronously write to stdout.
    map $status $access_log_level {
        ~^5 error;
        ~^4 warn;
        default info;
    }

    log_format access_json escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"method":"$request_method",'
        '"path":"$upstream_http_x_internal_log_route",'
        '"raw_path":"$request_uri",'
        '"status_code":$status,'
        '"duration_seconds":$request_time,'
        '"upstream_duration_seconds":"$upstream_response_time",'
        '"upstream_status":"$upstream_status",'
        '"level":"$access_log_level",'
        '"log_type":"access",'
        '"user_sub":"$upstream_http_x_internal_log_user_sub",'
        '"is_guest":"$upstream_http_x_internal_log_guest",'
        '"actor":"$upstream_http_x_internal_log_actor"'
    '}';

    access_log /var/log/nginx/access.log access_json buffer=64k flush=5s;

    # Resolve Compose service names inside the Docker network. The `resolve`
    # flag keeps an upstream valid when its container is recreated.
    resolver 127.0.0.11 valid=5s ipv6=off;
    
    # ------------------------------------------------------------
    # Upstream блоки для Keepalive (пул постоянных соединений)
    # ------------------------------------------------------------
    upstream fastapi_backend {
        zone fastapi_backend 64k;
        server fastapi:8000 resolve;
        keepalive 128; # Держим 128 соединений открытыми
    }

    upstream frontend_backend {
        zone frontend_backend 64k;
        server frontend:5173 resolve;
        keepalive 4;
    }

    upstream gcs_backend {
        zone gcs_backend 64k;
        server gcs:4443 resolve;
        keepalive 4;
    }

    # ------------------------------------------------------------
    # Маппинги
    # ------------------------------------------------------------
    map $http_x_forwarded_proto $client_scheme {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    map $http_user_agent $is_bot {
        default 0;
        "~*twitterbot" 1;
        "~*facebookexternalhit" 1;
        "~*telegrambot" 1;
        "~*slackbot" 1;
        "~*whatsapp" 1;
        "~*linkedinbot" 1;
        "~*discordbot" 1;
    }

    map $is_bot $proxy_upstream {
        0 http://frontend_backend;
        1 http://fastapi_backend;
    }

    map $is_bot $proxy_uri {
        0 $request_uri;
        1 /api/og$request_uri;
    }

    server {
        listen 80 default_server;
        server_name localhost;
        client_max_body_size 100m;

        # WebSockets - тут оставляем Connection "upgrade"
        location /ws/ {
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_hide_header X-Internal-Log-Route;
            proxy_hide_header X-Internal-Log-User-Sub;
            proxy_hide_header X-Internal-Log-Guest;
            proxy_hide_header X-Internal-Log-Actor;
        }
        
        # API - очищаем Connection для работы keepalive
        # Prometheus reaches FastAPI directly on the internal Docker network;
        # do not expose application metrics through the public API route.
        location = /api/metrics {
            return 404;
        }

        location = /api/metrics/ {
            return 404;
        }

        location /api/ {
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection ""; # Обязательно для keepalive
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Request-ID $request_id;
            proxy_hide_header X-Internal-Log-Route;
            proxy_hide_header X-Internal-Log-User-Sub;
            proxy_hide_header X-Internal-Log-Guest;
            proxy_hide_header X-Internal-Log-Actor;
        }

        # GCS эмулятор
        location ~ ^/gcs/([^/]+)/(.+)$ {
            set $bucket $1;
            set $object $2;
            proxy_http_version 1.1;
            proxy_set_header Connection ""; # Обязательно для keepalive
            
            proxy_set_header Host storage.googleapis.com;
            proxy_set_header Content-Length $content_length;
            proxy_set_header Transfer-Encoding "";
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, OPTIONS, DELETE";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, Range, x-goog-meta-filename, x-goog-meta-media-table, x-goog-meta-entity-id, x-goog-meta-media-format, x-goog-meta-media-order, x-goog-meta-mime-type";
            if ($request_method = OPTIONS) { return 204; }
            
            proxy_pass http://gcs_backend/$bucket/$object;
        }

        # Корневой роут (Frontend или OG-генератор)
        location / {
            proxy_pass $proxy_upstream$proxy_uri;
            proxy_http_version 1.1;
            
            # Для Vite HMR / WebSockets
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $client_scheme;
        }
    }
}
