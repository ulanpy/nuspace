events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    # Resolve Docker service names at request time. Containers receive a new
    # IP when recreated during development, so keep this cache short.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Prefer client scheme provided by Cloudflare/Cloudflared when present
    map $http_x_forwarded_proto $client_scheme {
        default $http_x_forwarded_proto; # https from tunnel
        ""      $scheme;                # fallback to local scheme (http)
    }

    # Detect common social media bots
    map $http_user_agent $is_bot {
        default 0;
        "~*twitterbot" 1;
        "~*facebookexternalhit" 1;
        "~*telegrambot" 1;
        "~*slackbot" 1;
        "~*whatsapp" 1;
        "~*linkedinbot" 1;
        "~*discordbot" 1;
    }

    # Route bots to OG endpoint while preserving the request path
    map $is_bot $proxy_upstream {
        0 http://frontend:5173;
        1 http://fastapi:8000;
    }

    map $is_bot $proxy_uri {
        0 $request_uri;
        1 /api/og$request_uri;
    }

    # Same routing, but pointed at the new frontend (see the :6767 server below).
    map $is_bot $web_upstream {
        0 http://web:5173;
        1 http://fastapi:8000;
    }
    server {
        listen 80 default_server;
        server_name localhost;
        client_max_body_size 100m;

        # Variables make proxy_pass resolve Docker service names dynamically.
        set $fastapi_upstream http://fastapi:8000;

        # Proxy WebSocket requests directly to FastAPI 
        location /ws/ {
            proxy_pass $fastapi_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $client_scheme;
        }

        
        # Serve all other requests from FastAPI
        location /api/ {
            proxy_pass $fastapi_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $client_scheme;  # ✅ preserve tunnel https
            proxy_set_header Cookie $http_cookie;  # ✅ Required

        }

        # Proxy for local GCS emulator to avoid CORS in browser
        # Map /gcs/{bucket}/{object} to XML API path-style (supports PUT/GET/HEAD)
        location ~ ^/gcs/([^/]+)/(.+)$ {
            set $bucket $1;
            set $object $2;
            proxy_http_version 1.1;
            proxy_set_header Host storage.googleapis.com;
            proxy_set_header Content-Length $content_length;
            proxy_set_header Transfer-Encoding "";
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, OPTIONS, DELETE";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, Range, x-goog-meta-filename, x-goog-meta-media-table, x-goog-meta-entity-id, x-goog-meta-media-format, x-goog-meta-media-order, x-goog-meta-mime-type";
            if ($request_method = OPTIONS) { return 204; }
            proxy_pass http://gcs:4443/$bucket/$object;
        }

        location / {
            proxy_pass $proxy_upstream$proxy_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            # Keep WS upgrade here so Vite HMR works through nginx proxy.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }



    }

    # ------------------------------------------------------------------------
    # New frontend (web/), served alongside the old one so both can be compared
    # against a single backend. Same API/WS/GCS routing as :80; only the
    # document root differs. Remove this block at cutover, when :80 starts
    # serving web/ directly.
    #
    # Not 8080: pgadmin already publishes that port in this compose file.
    # ------------------------------------------------------------------------
    server {
        listen 6767;
        server_name localhost;
        client_max_body_size 100m;

        set $fastapi_upstream http://fastapi:8000;

        location /ws/ {
            proxy_pass $fastapi_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $client_scheme;
        }

        location /api/ {
            proxy_pass $fastapi_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            proxy_set_header Cookie $http_cookie;
        }

        location ~ ^/gcs/([^/]+)/(.+)$ {
            set $bucket $1;
            set $object $2;
            proxy_http_version 1.1;
            proxy_set_header Host storage.googleapis.com;
            proxy_set_header Content-Length $content_length;
            proxy_set_header Transfer-Encoding "";
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, OPTIONS, DELETE";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, Range, x-goog-meta-filename, x-goog-meta-media-table, x-goog-meta-entity-id, x-goog-meta-media-format, x-goog-meta-media-order, x-goog-meta-mime-type";
            if ($request_method = OPTIONS) { return 204; }
            proxy_pass http://gcs:4443/$bucket/$object;
        }

        location / {
            proxy_pass $web_upstream$proxy_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            # Keep WS upgrade here so Vite HMR works through the nginx proxy.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
