worker_processes auto;

events {
    worker_connections 16000;
    use epoll;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    # Persist JSON access logs to a real file. Alloy tails this shared volume;
    # successful requests never make FastAPI synchronously write to stdout.
    map $status $access_log_level {
        ~^5 error;
        ~^4 warn;
        default info;
    }

    # Keep the serving component in the JSON body, not a Loki label. Nginx also
    # serves the frontend and GCS emulator, while these prefixes reach FastAPI.
    map $request_uri $access_log_service {
        default nginx;
        ~^/api(?:/|$) fastapi;
        ~^/ws(?:/|$) fastapi;
    }

    log_format access_json escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"upstream_service":"$access_log_service",'
        '"method":"$request_method",'
        '"path":"$upstream_http_x_internal_log_route",'
        '"raw_path":"$request_uri",'
        '"status_code":$status,'
        '"duration_seconds":$request_time,'
        '"upstream_duration_seconds":"$upstream_response_time",'
        '"upstream_status":"$upstream_status",'
        '"level":"$access_log_level",'
        '"log_type":"access",'
        '"user_sub":"$upstream_http_x_internal_log_user_sub",'
        '"is_guest":"$upstream_http_x_internal_log_guest",'
        '"actor":"$upstream_http_x_internal_log_actor"'
    '}';

    access_log /var/log/nginx/access.log access_json buffer=64k flush=5s;

    # Resolve Compose service names inside the Docker network. The `resolve`
    # flag keeps an upstream valid when its container is recreated.
    resolver 127.0.0.11 valid=5s ipv6=off;
    
    # ------------------------------------------------------------
    # Upstream блоки для Keepalive (пул постоянных соединений)
    # ------------------------------------------------------------
    upstream fastapi_backend {
        zone fastapi_backend 64k;
        server fastapi:8000 resolve;
        keepalive 128; # Держим 128 соединений открытыми
    }

    # `web` is the rebuilt frontend: at the cutover it took over :80, and the
    # old `frontend` service is still defined in the compose file but no longer
    # routed to. Point this back at frontend:5173 to fall back without editing
    # anything else.
    upstream web_backend {
        zone web_backend 64k;
        server web:5173 resolve;
        keepalive 4;
    }

    upstream gcs_backend {
        zone gcs_backend 64k;
        server gcs:4443 resolve;
        keepalive 4;
    }

    # ------------------------------------------------------------
    # Маппинги
    # ------------------------------------------------------------
    map $http_x_forwarded_proto $client_scheme {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # Link-preview bots. Keep in step with nginx.conf.
    map $http_user_agent $is_bot {
        default 0;
        "~*twitterbot" 1;
        "~*facebookexternalhit" 1;
        "~*telegrambot" 1;
        "~*telegram" 1;
        "~*slackbot" 1;
        "~*whatsapp" 1;
        "~*linkedinbot" 1;
        "~*discordbot" 1;
    }

    # Host → route table: $nuspace_service, $nuspace_env and $nuspace_owned.
    # `pnpm dev` regenerates it from web/src/lib/hosts/constants.ts first.
    include /etc/nginx/nuspace/hosts.conf;

    # Each host is its own `*.localhost` name, as in production: localhost is
    # the root host, events.localhost the events host, and so on.
    server {
        listen 80 default_server;
        server_name localhost *.localhost;
        client_max_body_size 100m;

        # The same wrong-host 404 as production, from the same generated page.
        error_page 404 /404.html;
        location = /404.html {
            internal;
            root /etc/nginx/nuspace;
            try_files /404.$nuspace_env.html =404;
        }

        # WebSockets - тут оставляем Connection "upgrade"
        location /ws/ {
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_hide_header X-Internal-Log-Route;
            proxy_hide_header X-Internal-Log-User-Sub;
            proxy_hide_header X-Internal-Log-Guest;
            proxy_hide_header X-Internal-Log-Actor;
        }
        
        # API - очищаем Connection для работы keepalive
        # Prometheus reaches FastAPI directly on the internal Docker network;
        # do not expose application metrics through the public API route.
        location = /api/metrics {
            return 404;
        }

        location = /api/metrics/ {
            return 404;
        }

        location /api/ {
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection ""; # Обязательно для keepalive
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Request-ID $request_id;
            proxy_hide_header X-Internal-Log-Route;
            proxy_hide_header X-Internal-Log-User-Sub;
            proxy_hide_header X-Internal-Log-Guest;
            proxy_hide_header X-Internal-Log-Actor;
        }

        # GCS эмулятор
        location ~ ^/gcs/([^/]+)/(.+)$ {
            set $bucket $1;
            set $object $2;
            proxy_http_version 1.1;
            proxy_set_header Connection ""; # Обязательно для keepalive
            
            proxy_set_header Host storage.googleapis.com;
            proxy_set_header Content-Length $content_length;
            proxy_set_header Transfer-Encoding "";
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, OPTIONS, DELETE";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, Range, x-goog-meta-filename, x-goog-meta-media-table, x-goog-meta-entity-id, x-goog-meta-media-format, x-goog-meta-media-order, x-goog-meta-mime-type";
            if ($request_method = OPTIONS) { return 204; }
            
            proxy_pass http://gcs_backend/$bucket/$object;
        }

        # Vite's module graph and files with an extension are not routes, so
        # every host serves them. Production does the same with try_files, and
        # a missing one gets the 404 page there too.
        location ~ ^/(?:@|src/|node_modules/|(?!api/|ws/|gcs/).*\.[A-Za-z0-9]+$) {
            proxy_intercept_errors on;
            proxy_pass http://web_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $client_scheme;
        }

        # Корневой роут (Frontend или OG-генератор)
        # A path this host does not own is a 404 before Vite is asked, for bots
        # too. An owned path goes to Vite, or, for a link-preview bot, to the
        # same @og_preview as production.
        location / {
            if ($nuspace_owned = 0) {
                return 404;
            }
            if ($is_bot) {
                return 418;
            }
            proxy_pass http://web_backend;
            proxy_http_version 1.1;
            
            # Для Vite HMR / WebSockets
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $client_scheme;
        }

        location @og_preview {
            set $access_log_service fastapi;
            proxy_pass http://fastapi_backend/api/og$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_hide_header X-Internal-Log-Route;
            proxy_hide_header X-Internal-Log-User-Sub;
            proxy_hide_header X-Internal-Log-Guest;
            proxy_hide_header X-Internal-Log-Actor;
        }

        error_page 418 = @og_preview;
    }
}
