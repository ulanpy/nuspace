events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;

  # Resolve Docker Compose DNS at request time. Without a variable proxy_pass,
  # nginx caches upstream IPs at worker start — recreate of a container then
  # yields 502 "No route to host" until nginx is reloaded.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Detect common social media bots for OG preview
  map $http_user_agent $is_bot {
    default 0;
    "~*twitterbot" 1;
    "~*facebookexternalhit" 1;
    "~*telegrambot" 1;
    "~*telegram" 1;
    "~*slackbot" 1;
    "~*whatsapp" 1;
    "~*linkedinbot" 1;
    "~*discordbot" 1;
  }

  # HTTP Server - Redirect to HTTPS
  server {
    listen 80;
    server_name nuspace.kz www.nuspace.kz stage.nuspace.kz;
    return 301 https://$host$request_uri;
  }

  # HTTPS Server with Cloudflare Origin Certificate
  server {
    listen 443 ssl;
    server_name nuspace.kz www.nuspace.kz stage.nuspace.kz;

    if ($host = www.nuspace.kz) {
      return 301 https://nuspace.kz$request_uri;
    }
    # Cloudflare Origin SSL
    ssl_certificate /etc/ssl/cloudflare/origin.crt;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    # Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_session_cache shared:SSL:10m;

    # Cloudflare IP restrictions now handled at GCP firewall level
    # No need for duplicate nginx restrictions. Check terraform/network.tf directory for more details.

    # Get real client IP from Cloudflare header
    # (GCP firewall ensures only Cloudflare IPs reach here)
    real_ip_header CF-Connecting-IP;

    # Application Configuration - Static Files
    root /var/www/my-app/out;
    index index.html;

    # Telegram Mini App Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://telegram.org https://t.me" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Variable forces runtime DNS lookup of fastapi (see resolver above).
    set $fastapi_upstream http://fastapi:8000;

    # API Proxy to FastAPI
    location /api {
      proxy_pass $fastapi_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Allow large Keycloak Set-Cookie headers (access/refresh/app tokens)
      proxy_buffer_size 32k;
      proxy_buffers 8 32k;
      proxy_busy_buffers_size 64k;

      # Telegram Mini App headers for API calls
      add_header X-Frame-Options "SAMEORIGIN";
      add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://telegram.org https://t.me" always;
    }

    # WebSocket (full $request_uri kept when proxy_pass has no URI path)
    location /ws/ {
      proxy_pass $fastapi_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    location = /favicon.ico {
      alias /var/www/my-app/out/favicon.ico;
      access_log off;
      log_not_found off;
      expires max;
    }

    # No dynamic route fallbacks needed - using query parameters instead
    # URLs: /communities/?id=123, /events/?id=123, /sgotinish/sg/ticket/?id=123

    location = /index.html {
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://telegram.org https://t.me" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      try_files /index.html =404;
    }

    # Static Files - SPA fallback
    location / {
      if ($is_bot) {
        return 418;
      }
      autoindex off;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://telegram.org https://t.me" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      try_files $uri $uri/ /index.html;
    }

    location @og_preview {
      proxy_pass $fastapi_upstream/api/og$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 418 = @og_preview;

    # Cache fingerprinted static assets aggressively. Vite changes filenames on content changes.
    location ~* \.(js|css|png|jpg|jpeg|webp|svg|woff2)$ {
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://telegram.org https://t.me" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
  }

  # VPN-only
  server {
    listen 443 ssl;
    server_name vpn.nuspace.kz;

    allow 172.28.0.0/24; # Docker network (all containers)
    allow 10.13.13.0/24; # WireGuard clients
    deny all;

    # Variable proxy_pass forces runtime DNS (same pattern as fastapi above).
    set $wg_easy_upstream http://wg-easy:51821;
    set $grafana_upstream http://grafana:3000;
    set $alloy_upstream http://alloy:12345;
    set $prometheus_upstream http://prometheus:9090;

    # wg-easy Web UI — served at root since it doesn't support sub-paths
    location / {
      proxy_pass $wg_easy_upstream$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /monitoring {
      root /etc/nginx;
      index vpn-index.html;
      try_files /vpn-index.html =404;
    }

    location /grafana/ {
      rewrite ^/grafana(/.*)$ $1 break;
      rewrite ^/grafana$ /grafana/ permanent;
      proxy_pass $grafana_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Script-Name /grafana;
    }

    location /alloy/ {
      proxy_pass $alloy_upstream$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /prometheus/ {
      proxy_pass $prometheus_upstream$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}