worker_processes auto;

events {
  # Each proxied request consumes client and upstream sockets.
  worker_connections 16000;
  use epoll;
  multi_accept on;
}

http {
  include mime.types;
  default_type application/octet-stream;
  # Alloy tails this buffered file; application responses never make FastAPI
  # synchronously write an access log to Docker stdout.
  map $status $access_log_level {
    ~^5 error;
    ~^4 warn;
    default info;
  }

  # Keep the serving component in the JSON body, not a Loki label. Nginx also
  # serves Grafana, Prometheus and static files, while these prefixes reach
  # FastAPI even when it returns an unhandled 500 without response metadata.
  map $request_uri $access_log_service {
    default nginx;
    ~^/api(?:/|$) fastapi;
    ~^/ws(?:/|$) fastapi;
  }

  log_format access_json escape=json '{'
    '"timestamp":"$time_iso8601",'
    '"request_id":"$request_id",'
    '"upstream_service":"$access_log_service",'
    '"method":"$request_method",'
    '"path":"$upstream_http_x_internal_log_route",'
    '"raw_path":"$request_uri",'
    '"status_code":$status,'
    '"duration_seconds":$request_time,'
    '"upstream_duration_seconds":"$upstream_response_time",'
    '"upstream_status":"$upstream_status",'
    '"level":"$access_log_level",'
    '"log_type":"access",'
    '"user_sub":"$upstream_http_x_internal_log_user_sub",'
    '"is_guest":"$upstream_http_x_internal_log_guest",'
    '"actor":"$upstream_http_x_internal_log_actor"'
  '}';
  access_log /var/log/nginx/access.log access_json buffer=64k flush=5s;

  resolver 127.0.0.11 valid=5s ipv6=off;

  upstream fastapi_backend {
    zone fastapi_backend 64k;
    server fastapi:8000 resolve;
    keepalive 128;
  }

  # Detect common social media bots for OG preview
  map $http_user_agent $is_bot {
    default 0;
    "~*twitterbot" 1;
    "~*facebookexternalhit" 1;
    "~*telegrambot" 1;
    "~*telegram" 1;
    "~*slackbot" 1;
    "~*whatsapp" 1;
    "~*linkedinbot" 1;
    "~*discordbot" 1;
  }

  map $http_x_forwarded_proto $client_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
  }

  # Host → route table: $nuspace_service, $nuspace_env and $nuspace_owned.
  # Generated from web/src/lib/hosts/constants.ts and mounted from the repo
  # checkout, outside web/out/, which the deploy role empties.
  include /etc/nginx/nuspace/hosts.conf;

  # HTTP Server - Redirect to HTTPS
  server {
    listen 80;
    server_name nuspace.kz www.nuspace.kz stage.nuspace.kz;
    return 301 https://$host$request_uri;
  }

  # HTTPS Server with Cloudflare Origin Certificate
  #
  # Every first-party host lands here, production and staging alike. Which
  # host serves which path is the route table's call, not server_name's: a
  # host with no row in it gets the 404 page for every path, rather than
  # quietly serving the root host's app.
  server {
    listen 443 ssl default_server;
    server_name _;

    if ($host = www.nuspace.kz) {
      return 301 https://nuspace.kz$request_uri;
    }
    # Cloudflare Origin SSL
    ssl_certificate /etc/ssl/cloudflare/origin.crt;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    # Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_session_cache shared:SSL:10m;

    # Cloudflare IP restrictions now handled at GCP firewall level
    # No need for duplicate nginx restrictions. Check terraform/network.tf directory for more details.

    # Get real client IP from Cloudflare header
    # (GCP firewall ensures only Cloudflare IPs reach here)
    real_ip_header CF-Connecting-IP;

    # Application Configuration - Static Files
    root /var/www/my-app/out;

    # Telegram Mini App Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://telegram.org https://t.me" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Prometheus scrapes FastAPI directly over the internal Docker network.
    # Never proxy application metrics through the public /api namespace.
    location = /api/metrics {
      return 404;
    }

    location = /api/metrics/ {
      return 404;
    }

    # API Proxy to FastAPI. `/api/`, not `/api`: a prefix without the slash
    # also takes `/api-club`, and a Page's address is `pages.nuspace.kz/<slug>`.
    location /api/ {
      proxy_pass http://fastapi_backend;
      # keep alive connections will only work if http 1.1      
      proxy_http_version 1.1;
      # remove "Connection: close" header, which nginx sends by default to upstream to close connection
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $client_scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_hide_header X-Internal-Log-Route;
      proxy_hide_header X-Internal-Log-User-Sub;
      proxy_hide_header X-Internal-Log-Guest;
      proxy_hide_header X-Internal-Log-Actor;
      # Allow large Keycloak Set-Cookie headers (access/refresh/app tokens)
      proxy_buffer_size 32k;
      proxy_buffers 8 32k;
      proxy_busy_buffers_size 64k;

      # Telegram Mini App headers for API calls
      add_header X-Frame-Options "SAMEORIGIN";
      add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://telegram.org https://t.me" always;
    }

    # WebSocket (full $request_uri kept when proxy_pass has no URI path)
    location /ws/ {
      proxy_pass http://fastapi_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $client_scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_hide_header X-Internal-Log-Route;
      proxy_hide_header X-Internal-Log-User-Sub;
      proxy_hide_header X-Internal-Log-Guest;
      proxy_hide_header X-Internal-Log-Actor;
    }

    location = /favicon.ico {
      alias /var/www/my-app/out/favicon.ico;
      access_log off;
      log_not_found off;
      expires max;
    }

    # Every 404 nginx answers itself (a wrong-host path, a host with no row, a
    # missing file) is the page naming the six hosts in the visitor's
    # environment. It loads no script. FastAPI's own 404s pass through as-is.
    error_page 404 /404.html;
    location = /404.html {
      internal;
      root /etc/nginx/nuspace;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://telegram.org https://t.me" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      try_files /404.$nuspace_env.html =404;
    }

    # One index.html per host (web/out/_hosts/<service>/index.html), reached
    # only through @nuspace_route below.
    location ^~ /_hosts/ {
      internal;
    }

    # Static files at the build root are served on every host; anything else
    # is a route.
    location / {
      autoindex off;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://telegram.org https://t.me" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      try_files $uri @nuspace_route;
    }

    # A path this host does not own is a 404 before any JavaScript loads, for
    # bots too. An owned path gets its host's index.html, or a preview card.
    location @nuspace_route {
      if ($nuspace_owned = 0) {
        return 404;
      }
      if ($is_bot) {
        return 418;
      }
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://telegram.org https://t.me" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      try_files /_hosts/$nuspace_service/index.html =404;
    }

    location @og_preview {
      set $access_log_service fastapi;
      proxy_pass http://fastapi_backend/api/og$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $client_scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_hide_header X-Internal-Log-Route;
      proxy_hide_header X-Internal-Log-User-Sub;
      proxy_hide_header X-Internal-Log-Guest;
      proxy_hide_header X-Internal-Log-Actor;
    }

    error_page 418 = @og_preview;

    # Cache fingerprinted static assets aggressively. Vite changes filenames on content changes.
    location ~* \.(js|css|png|jpg|jpeg|webp|svg|woff2)$ {
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://telegram.org https://t.me" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
  }

  # VPN-only
  server {
    listen 443 ssl;
    server_name vpn.nuspace.kz;

    allow 172.28.0.0/24; # Docker network (all containers)
    allow 10.13.13.0/24; # WireGuard clients
    deny all;

    # Variable proxy_pass forces runtime DNS (same pattern as fastapi above).
    set $wg_easy_upstream http://wg-easy:51821;
    set $grafana_upstream http://grafana:3000;
    set $alloy_upstream http://alloy:12345;
    set $prometheus_upstream http://prometheus:9090;

    # wg-easy Web UI — served at root since it doesn't support sub-paths
    location / {
      proxy_pass $wg_easy_upstream$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /monitoring {
      root /etc/nginx;
      index vpn-index.html;
      try_files /vpn-index.html =404;
    }

    location /grafana/ {
      rewrite ^/grafana(/.*)$ $1 break;
      rewrite ^/grafana$ /grafana/ permanent;
      proxy_pass $grafana_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Script-Name /grafana;
    }

    location /alloy/ {
      proxy_pass $alloy_upstream$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /prometheus/ {
      proxy_pass $prometheus_upstream$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
