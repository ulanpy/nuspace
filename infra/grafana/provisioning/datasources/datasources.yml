apiVersion: 1

# Fixed UIDs so file-provisioned dashboards/alerts survive grafana-data volume wipe.
deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Loki
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: PBFA97CFB590B2093
    url: http://prometheus:9090/prometheus/
    access: proxy
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    uid: P8E80F9AEF21F6940
    url: http://loki:3100
    access: proxy
    editable: false
