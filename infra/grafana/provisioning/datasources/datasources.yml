apiVersion: 1

# Fixed UIDs so file-provisioned dashboards/alerts survive grafana-data volume wipe.
deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Loki
    orgId: 1
  - name: Tempo
    orgId: 1
  - name: PostgreSQL
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: PBFA97CFB590B2093
    url: http://prometheus:9090/prometheus/
    access: proxy
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    uid: P8E80F9AEF21F6940
    url: http://loki:3100
    access: proxy
    editable: false
    jsonData:
      derivedFields:
        - name: TraceID
          datasourceUid: tempo
          matcherRegex: '"trace_id":"([a-f0-9]+)"'
          url: "$${__value.raw}"
          urlDisplayLabel: View Trace

  - name: Tempo
    type: tempo
    uid: tempo
    url: http://tempo:3200
    access: proxy
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: P8E80F9AEF21F6940
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        filterByTraceID: false
        customQuery: true
        query: '{service_name="fastapi"} | json | trace_id="${__span.traceId}"'
      tracesToMetrics:
        datasourceUid: PBFA97CFB590B2093
      serviceMap:
        datasourceUid: PBFA97CFB590B2093
      nodeGraph:
        enabled: true
      lokiSearch:
        datasourceUid: P8E80F9AEF21F6940

  # Product analytics (SELECT-only). Role is bootstrapped by grafana-db-init on every compose up.
  - name: PostgreSQL
    type: postgres
    uid: PSQL_NUSPACE
    url: postgres:5432
    user: ${GRAFANA_DB_USER}
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
    jsonData:
      database: ${DB_NAME}
      sslmode: disable
      maxOpenConns: 5
      connMaxLifetime: 14400
      postgresVersion: 1700
    editable: false
