apiVersion: 1

# This is the complete routing tree. Rules deliberately do not select a
# receiver directly, so their repeat behaviour remains versioned here.
policies:
  - orgId: 1
    receiver: Telegram
    group_by:
      - alertname
      - grafana_folder
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      # Capacity warnings are useful to see promptly, but repeating them more
      # often than daily would only create Telegram noise.
      - receiver: Telegram
        object_matchers:
          - [alert_group, "=", disk]
        group_by:
          - alertname
          - grafana_folder
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 24h

      # A saturated DB pool can become an outage; keep reminders actionable.
      - receiver: Telegram
        object_matchers:
          - [alert_group, "=", database]
        group_by:
          - alertname
          - grafana_folder
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 2h

      # Backups are scheduled rather than request-driven, so a daily reminder
      # after the initial alert is enough.
      - receiver: Telegram
        object_matchers:
          - [alert_group, "=", backup]
        group_by:
          - alertname
          - grafana_folder
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 24h
