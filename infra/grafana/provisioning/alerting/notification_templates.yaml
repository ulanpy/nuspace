apiVersion: 1

templates:
  - orgId: 1
    name: nuspace
    template: |
      {{ define "nuspace.telegram.message" -}}
      {{- $alert := index .Alerts 0 -}}
      {{- $summary := or $alert.Annotations.summary $alert.Labels.alertname "Alert" -}}
      {{- $description := $alert.Annotations.description -}}
      {{- if eq .Status "firing" -}}
      🔴 <b>{{ $summary }}</b>
      {{- if $description }}

      {{ $description }}
      {{- end }}
      {{- else -}}
      ✅ <b>{{ $summary }}</b> — восстановлено
      {{- with $alert }}
      {{- if and .StartsAt .EndsAt }}
      {{- $downtime := .EndsAt.Sub .StartsAt }}
      Длительность: <code>{{ printf "%.0f" $downtime.Seconds }}</code> с
      {{- end }}
      {{- end }}
      {{- end }}

      {{- with $alert }}
      <a href="{{ .GeneratorURL }}">Открыть в Grafana</a> · <a href="{{ .SilenceURL }}">Заглушить</a>
      {{- end }}
      {{- end }}
