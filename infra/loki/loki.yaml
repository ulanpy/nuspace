# Local/dev Loki: filesystem storage (same model as prod after GCS cutover).

auth_enabled: false

server:
  http_listen_port: 3100

limits_config:
  retention_period: 168h
  allow_structured_metadata: true
  volume_enabled: true

common:
  path_prefix: /loki
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
  replication_factor: 1

schema_config:
  configs:
    - from: 2020-05-15
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /loki/chunks
  tsdb_shipper:
    active_index_directory: /loki/active_index_data
    cache_location: /loki/index_cache

ingester:
  # Bytes. Keep Loki's 1.5 MiB default; 1536 would mean only 1.5 KiB.
  chunk_target_size: 1572864

compactor:
  working_directory: /loki/compactor_work
  compaction_interval: 1h
  retention_enabled: true
  delete_request_store: filesystem
  retention_delete_delay: 2h
  retention_delete_worker_count: 5

pattern_ingester:
  enabled: false
