# Production Loki: local filesystem only (no GCS).
# Avoids Class A ops / storage billing on gs://nuspace-logs.
# Logs survive container restart via loki_data volume; wiped by `docker compose down -v`.

auth_enabled: false

server:
  http_listen_port: 3100

limits_config:
  retention_period: 168h
  allow_structured_metadata: true
  volume_enabled: true
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  per_stream_rate_limit: 1MB
  per_stream_rate_limit_burst: 2MB
  max_streams_per_user: 500
  max_label_name_length: 100
  max_label_value_length: 2048
  max_label_names_per_series: 15
  max_line_size: 256kb
  reject_old_samples: true
  reject_old_samples_max_age: 168h

common:
  path_prefix: /loki
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
  replication_factor: 1

schema_config:
  configs:
    - from: 2020-05-15
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /loki/chunks
  tsdb_shipper:
    active_index_directory: /loki/active_index_data
    cache_location: /loki/index_cache

ingester:
  # Bytes. Keep Loki's 1.5 MiB default; 1536 would mean only 1.5 KiB.
  chunk_target_size: 1572864
  chunk_idle_period: 30m
  max_chunk_age: 2h

compactor:
  working_directory: /loki/compactor_work
  compaction_interval: 1h
  retention_enabled: true
  delete_request_store: filesystem
  retention_delete_delay: 2h
  retention_delete_worker_count: 5

pattern_ingester:
  enabled: false
