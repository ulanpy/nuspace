# Tempo 3.x monolithic (-target=all): local filesystem, 72h retention.
# Apps → Alloy OTLP → Tempo. Span metrics → Prometheus remote write.

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

# Tempo 3: live-store replaces ingester for recent traces.
live_store:
  max_trace_idle: 10s
  max_block_duration: 5m
  max_block_bytes: 1_000_000

# Tempo 3: backend_scheduler replaces standalone compactor.
backend_scheduler:
  provider:
    compaction:
      compaction:
        compaction_window: 1h
        max_block_bytes: 100_000_000
        block_retention: 72h
        compacted_block_retention: 1h

storage:
  trace:
    backend: local
    block:
      bloom_filter_false_positive: 0.05
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
    pool:
      max_workers: 100
      queue_depth: 10000

metrics_generator:
  processor:
    span_metrics:
      dimensions:
        - http.method
        - http.route
        - http.status_code
    service_graphs:
      dimensions:
        - http.method
        - http.route
        - http.status_code
  registry:
    collection_interval: 15s
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/prometheus/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    compaction:
      block_retention: 72h
      compaction_window: 1h
    metrics_generator:
      processors: [service-graphs, span-metrics]
      generate_native_histograms: both

usage_report:
  reporting_enabled: false
