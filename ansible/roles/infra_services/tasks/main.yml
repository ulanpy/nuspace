---
- name: Recreate redis service
  ansible.builtin.command: >
    {{ compose_cmd }} -f /home/{{ ansible_user }}/nuspace/infra/prod.docker-compose.yml
    up -d redis

  when: (redis_changed | default(false)) | bool or (container_analysis is defined and 'redis' in container_analysis.stdout)
  async: 600
  poll: 0
  register: redis_job

- name: Recreate rabbitmq service
  ansible.builtin.command: >
    {{ compose_cmd }} -f /home/{{ ansible_user }}/nuspace/infra/prod.docker-compose.yml
    up -d rabbitmq

  when: (rabbitmq_changed | default(false)) | bool or (container_analysis is defined and 'rabbitmq' in container_analysis.stdout)
  async: 600
  poll: 0
  register: rabbitmq_job

- name: Recreate meilisearch service
  ansible.builtin.command: >
    {{ compose_cmd }} -f /home/{{ ansible_user }}/nuspace/infra/prod.docker-compose.yml
    up -d meilisearch

  when: (meilisearch_changed | default(false)) | bool or (container_analysis is defined and 'meilisearch' in container_analysis.stdout)
  async: 600
  poll: 0
  register: meilisearch_job

# Observability stack in one compose invocation — avoids races (Alloy/Grafana
# depend on the other observability services being present).
- name: Pull Pyroscope image when its configuration changes
  ansible.builtin.command: >
    {{ compose_cmd }} -f /home/{{ ansible_user }}/nuspace/infra/prod.docker-compose.yml
    pull pyroscope
  when: (pyroscope_changed | default(false)) | bool

- name: Recreate observability stack (Pyroscope, Tempo, Prometheus, Loki, Alloy, Grafana)
  ansible.builtin.command: >
    {{ compose_cmd }} -f /home/{{ ansible_user }}/nuspace/infra/prod.docker-compose.yml
    up -d pyroscope tempo prometheus loki alloy grafana

  when: >
    (prometheus_changed | default(false)) | bool or
    (grafana_changed | default(false)) | bool or
    (loki_changed | default(false)) | bool or
    (alloy_changed | default(false)) | bool or
    (tempo_changed | default(false)) | bool or
    (pyroscope_changed | default(false)) | bool or
    (
      container_analysis is defined and (
        'prometheus' in container_analysis.stdout or
        'grafana' in container_analysis.stdout or
        'loki' in container_analysis.stdout or
        'alloy' in container_analysis.stdout or
        'tempo' in container_analysis.stdout or
        'pyroscope' in container_analysis.stdout
      )
    )
  async: 600
  poll: 0
  register: observability_job

- name: Recreate wg-easy service
  ansible.builtin.command: >
    {{ compose_cmd }} -f /home/{{ ansible_user }}/nuspace/infra/prod.docker-compose.yml
    up -d wg-easy

  when: (wg_easy_changed | default(false)) | bool or (container_analysis is defined and 'wg-easy' in container_analysis.stdout)
  async: 600
  poll: 0
  register: wg_easy_job

- name: Wait for infra services tasks to finish
  ansible.builtin.async_status:
    jid: "{{ item.ansible_job_id }}"
  register: infra_wait_result
  until: infra_wait_result.finished
  retries: 200
  delay: 2
  loop: "{{ [
      redis_job|default({}),
      rabbitmq_job|default({}),
      meilisearch_job|default({}),
      observability_job|default({}),
      wg_easy_job|default({})
    ] | selectattr('ansible_job_id', 'defined') | list }}"

- name: Pull postgres and backup images when compose changed
  ansible.builtin.shell: |
    #!/bin/bash
    set -e
    COMPOSE_FILE="/home/{{ ansible_user }}/nuspace/infra/prod.docker-compose.yml"
    {{ compose_cmd }} -f "$COMPOSE_FILE" pull postgres backup
  args:
    executable: /bin/bash
  when: (compose_changed | default(false)) | bool

- name: Reconcile docker compose changes (definitions only)
  ansible.builtin.command: >
    {{ compose_cmd }} -f /home/{{ ansible_user }}/nuspace/infra/prod.docker-compose.yml
    up -d --remove-orphans

  when: (compose_changed | default(false)) | bool

- name: Prune all unused Docker assets
  ansible.builtin.command: docker system prune -a -f
  changed_when: false

