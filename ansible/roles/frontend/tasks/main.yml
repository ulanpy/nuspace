---
# Static files are built in GitHub Actions and shipped as a tarball on the controller.
# `frontend_tarball_path` is set by CI when frontend paths changed; empty skips deploy.

- name: Ensure frontend out directory exists with proper permissions
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/nuspace/web/out"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
  when: frontend_tarball_path | default('') | length > 0

- name: Clear previous static export
  ansible.builtin.shell: |
    set -e
    rm -rf /home/{{ ansible_user }}/nuspace/web/out/*
  args:
    executable: /bin/bash
  when: frontend_tarball_path | default('') | length > 0

- name: Unpack frontend build from CI runner to VM
  ansible.builtin.unarchive:
    src: "{{ frontend_tarball_path }}"
    dest: "/home/{{ ansible_user }}/nuspace/web/out"
    remote_src: false
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  when: frontend_tarball_path | default('') | length > 0

# One index.html per host lives under _hosts/ (web/src/lib/hosts); the root
# host's is always there. The nginx include is in the repo checkout, not here.
- name: Verify out files were created
  ansible.builtin.stat:
    path: "/home/{{ ansible_user }}/nuspace/web/out/_hosts/root/index.html"
  register: dist_check
  when: frontend_tarball_path | default('') | length > 0

- name: Fail if out files are missing
  ansible.builtin.fail:
    msg: "Frontend artifact missing _hosts/root/index.html after unpack."
  when:
    - frontend_tarball_path | default('') | length > 0
    - not dist_check.stat.exists

- name: Show frontend deploy success message
  ansible.builtin.debug:
    msg: "Frontend static files from CI are deployed under web/out."
  when: frontend_tarball_path | default('') | length > 0

- name: Recreate nginx service to pick up new out files
  ansible.builtin.command: >
    {{ compose_cmd }} -f /home/{{ ansible_user }}/nuspace/infra/prod.docker-compose.yml
    up --no-deps -d nginx
  when:
    - (nginx_changed | default(false)) | bool or
      (container_analysis is defined and 'nginx' in container_analysis.stdout) or
      (frontend_tarball_path | default('') | length > 0)

# `up -d` leaves an unchanged container running on its old config, and the
# route-table include (web/nginx/hosts.conf, synced with the repo) changes
# with the frontend. Reload after the new _hosts/ entries are unpacked; a bad
# include fails `nginx -t` here and the running config stays in place.
- name: Reload nginx so it reads the route-table include
  ansible.builtin.command: >
    {{ compose_cmd }} -f /home/{{ ansible_user }}/nuspace/infra/prod.docker-compose.yml
    exec -T nginx sh -c 'nginx -t && nginx -s reload'
  when:
    - (nginx_changed | default(false)) | bool or
      (frontend_tarball_path | default('') | length > 0)
